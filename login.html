<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clinic home page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="home-page">
    <main class="main-content">
        
        <div class="notification-banner error-banner">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span class="notification-text">error: invalid credentials or server timeout.</span>
        </div>

        <section class="login-section">
            <div class="login-card">
                <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> back to home</a>
                <h2 class="section-title">account login</h2>
                
                <form class="login-form" action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="user-email" class="form-label">email address</label>
                        <input type="email" id="user-email" class="form-control" placeholder="enter your email">
                    </div>

                    <div class="form-group">
                        <label for="user-password" class="form-label">password</label>
                        <input type="password" id="user-password" class="form-control error-input" placeholder="enter your password" value="123">
                        <span class="validation-error">password must be at least 8 characters long.</span>
                    </div>

                    <div class="form-actions">
                        <a href="admin-users.html" class="btn-primary">login as admin</a>
                        <a href="user-profile.html" class="btn-secondary">login as patient</a>
                    </div>

                </form>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p class="footer-text">copyright 2024 clinic system. all rights reserved.</p>
    </footer>

</body>
</html>
