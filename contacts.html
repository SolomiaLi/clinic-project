<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clinic home page</title>
    <link rel="stylesheet" href="scss/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="home-page">

    <header class="site-header">
        <div class="header-container">
            
            <a href="index.html" class="logo-link">
                <i class="fa-solid fa-staff-snake logo-icon"></i>
                <span class="logo-text"></span>
            </a>

            <input type="checkbox" id="burger-toggle" class="burger-checkbox">

            <nav class="main-nav">
                <a href="services.html" class="nav-link">services</a>
                <a href="doctors.html" class="nav-link">doctors</a>
                <a href="contacts.html" class="nav-link">contacts</a>
            </nav>

            <div class="header-right">
                <a href="login.html" class="account-link">
                    <i class="fa-regular fa-user account-icon"></i>
                    <span class="account-text"></span>
                </a>
                <label for="burger-toggle" class="burger-label">
                    <i class="fa-solid fa-bars"></i>
                </label>
            </div>
            
        </div>
    </header>

    <main class="main-content">
        <section class="page-section">
            <h2 class="section-title" style="text-align: center; margin-bottom: 40px;">get in touch</h2>
            
            <div class="contact-wrapper">
                <div class="contact-info">
                    <h3>clinic details</h3>
                    <p><i class="fa-solid fa-location-dot"></i> Kyiv, Khreshchatyk st. 1</p>
                    <p><i class="fa-solid fa-phone"></i> +38 (050) 123-45-67</p>
                    <p><i class="fa-solid fa-envelope"></i> info@clinic.com</p>
                    <p><i class="fa-solid fa-clock"></i> Mon - Fri: 8:00 - 20:00</p>
                </div>

                <form class="contact-form modal-form">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Your Email">
                    </div>
                    <div class="form-group">
                        <textarea class="form-control" rows="4" placeholder="Your Message" style="resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">send message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-text">copyright 2024 clinic system. all rights reserved.</p>
    </footer>

</body>
</html>
